<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bowman Family Recipes</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0d19;
            --card-bg: rgba(22, 26, 46, 0.6);
            --border-color: rgba(255, 255, 255, 0.06);
            --accent-color: #a78bfa;
            --accent-glow: rgba(139, 92, 246, 0.3);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Decorative Background Orbs */
        body::before {
            content: "";
            position: absolute;
            top: -10%;
            left: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(167, 139, 250, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: -1;
            filter: blur(80px);
            pointer-events: none;
        }
        body::after {
            content: "";
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: -1;
            filter: blur(80px);
            pointer-events: none;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 40px 20px;
            flex-grow: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* Controls Block */
        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-bar {
            width: 100%;
            padding: 16px 50px 16px 24px;
            font-size: 1.1rem;
            font-family: 'Outfit', sans-serif;
            background: rgba(22, 26, 46, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            color: white;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        /* Category & Method Chips */
        .chips-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .chip {
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip:hover {
            color: white;
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .chip.active {
            background: var(--accent-color);
            color: #0b0d19;
            border-color: var(--accent-color);
            font-weight: 600;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        /* Recipe Count */
        .results-count {
            text-align: center;
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: -10px;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s, box-shadow 0.4s;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            aspect-ratio: 1 / 1.1;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(167, 139, 250, 0.3);
            box-shadow: 0 20px 40px rgba(139, 92, 246, 0.12);
        }

        .card-img-wrapper {
            width: 100%;
            height: 60%;
            position: relative;
            overflow: hidden;
            background: #141624;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover .card-img {
            transform: scale(1.05);
        }

        .card-img-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.15);
            font-weight: 500;
            background: linear-gradient(135deg, #161a30 0%, #0d0f1d 100%);
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: white;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .card-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .card-tag {
            background: rgba(167, 139, 250, 0.12);
            color: var(--accent-color);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 13, 25, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: rgba(22, 26, 46, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            width: 100%;
            max-width: 1100px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-header {
            padding: 25px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.1);
        }

        .modal-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: white;
            line-height: 1.3;
        }

        .close-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.05);
        }

        .modal-body {
            flex-grow: 1;
            overflow-y: auto;
            padding: 30px;
            display: grid;
            grid-template-columns: 1.2fr 1.8fr;
            gap: 40px;
            font-family: 'Inter', sans-serif;
        }

        @media (max-width: 768px) {
            .modal-body {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }

        /* Left Column Details */
        .modal-left {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .modal-img-container {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #141624;
            border: 1px solid var(--border-color);
            aspect-ratio: 16 / 10;
        }

        .modal-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            font-style: italic;
        }

        .modal-section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: white;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        /* Ingredients Checkboxes */
        .ingredient-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 8px 0;
            cursor: pointer;
            user-select: none;
            color: #d1d5db;
            font-size: 0.95rem;
            line-height: 1.5;
            transition: opacity 0.2s;
        }

        .ingredient-item input[type="checkbox"] {
            margin-top: 4px;
            accent-color: var(--accent-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .ingredient-item.checked {
            text-decoration: line-through;
            color: var(--text-muted);
            opacity: 0.6;
        }

        /* Right Column Details */
        .modal-right {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Custom Numbered List for Directions */
        .direction-step {
            display: flex;
            gap: 18px;
            margin-bottom: 20px;
            line-height: 1.6;
            color: #e5e7eb;
            font-size: 0.98rem;
        }

        .step-number {
            background: rgba(167, 139, 250, 0.12);
            color: var(--accent-color);
            font-weight: 700;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            margin-top: 2px;
        }

        .step-text {
            flex-grow: 1;
        }

        /* Notes Box */
        .notes-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            color: #cbd5e1;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .notes-box p {
            margin-bottom: 12px;
        }
        .notes-box p:last-child {
            margin-bottom: 0;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            margin-top: 60px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Bowman Family Recipes</h1>
        <div class="subtitle">Searchable Culinary Portal &amp; Kitchen Companion</div>
    </header>

    <div class="controls-container">
        <!-- Intelligent Search Bar -->
        <div class="search-wrapper">
            <input type="text" id="search-input" class="search-bar" placeholder="Try 'kale and orzo' or 'dessert with strawberries'...">
            <div class="search-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </div>
        </div>

        <!-- Filter Chips -->
        <div class="chips-bar" id="category-chips">
            <button class="chip active" data-filter="All">All Recipes</button>
            <button class="chip" data-filter="Entree">Entrees</button>
            <button class="chip" data-filter="Soup">Soups</button>
            <button class="chip" data-filter="Salad">Salads</button>
            <button class="chip" data-filter="Breakfast">Breakfast</button>
            <button class="chip" data-filter="Dessert">Dessert</button>
            <button class="chip" data-filter="Bake">Baking</button>
            <button class="chip" data-filter="Crockpot">Crockpot</button>
        </div>
    </div>

    <!-- Results Counter -->
    <div class="results-count" id="results-counter">Showing all recipes</div>

    <!-- Recipe Cards Grid -->
    <div class="grid" id="recipes-grid">
        <!-- Dynamic Cards Inserted Here -->
    </div>
</div>

<!-- Overlay Detail Modal -->
<div class="modal-overlay" id="recipe-modal" onclick="closeRecipeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-header">
            <h2 class="modal-title" id="modal-title">Recipe Name</h2>
            <button class="close-btn" onclick="toggleModal(false)">&times;</button>
        </div>
        <div class="modal-body">
            <!-- Left Side: Image and Ingredients -->
            <div class="modal-left">
                <div class="modal-img-container" id="modal-img-container">
                    <img class="modal-img" id="modal-img" src="" alt="Recipe Card">
                </div>
                <div class="modal-desc" id="modal-description"></div>
                
                <div>
                    <h3 class="modal-section-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        Ingredients
                    </h3>
                    <div id="modal-ingredients">
                        <!-- Ingredient Checkboxes Inserted Here -->
                    </div>
                </div>
            </div>

            <!-- Right Side: Directions and Notes -->
            <div class="modal-right">
                <div>
                    <h3 class="modal-section-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                        Directions
                    </h3>
                    <div id="modal-directions">
                        <!-- Steps Inserted Here -->
                    </div>
                </div>

                <div id="modal-notes-container">
                    <h3 class="modal-section-title">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        Notes
                    </h3>
                    <div class="notes-box" id="modal-notes">
                        <!-- Notes/Nutrition Info Inserted Here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer>
    Bowman Family Recipe Dashboard &bull; Powered by GitPages &bull; 2026
</footer>

<!-- Load master database -->
<script src="recipes_db.js"></script>
<script>
    let activeFilter = 'All';
    let currentSearchQuery = '';

    const searchInput = document.getElementById('search-input');
    const recipesGrid = document.getElementById('recipes-grid');
    const resultsCounter = document.getElementById('results-counter');
    const chips = document.querySelectorAll('.chip');
    
    // 1. Initial Load
    window.onload = function() {
        renderRecipes(RECIPES_DB);
        
        // Input Listener
        searchInput.addEventListener('input', function(e) {
            currentSearchQuery = e.target.value;
            applyFilters();
        });
        
        // Chips Listeners
        chips.forEach(chip => {
            chip.addEventListener('click', function() {
                chips.forEach(c => c.classList.remove('active'));
                this.classList.add('active');
                activeFilter = this.getAttribute('data-filter');
                applyFilters();
            });
        });
    };

    // 2. Filter & Search Logic
    function applyFilters() {
        let filtered = RECIPES_DB;
        
        // Apply tag/method category chip filter
        if (activeFilter !== 'All') {
            filtered = filtered.filter(recipe => {
                return recipe.tags.includes(activeFilter) || recipe.methods.includes(activeFilter);
            });
        }
        
        // Apply Intelligent LLM-style Natural Language Search Query
        if (currentSearchQuery.trim() !== '') {
            filtered = searchRecipes(currentSearchQuery, filtered);
        }
        
        renderRecipes(filtered);
        
        // Update Counter
        if (filtered.length === RECIPES_DB.length) {
            resultsCounter.innerText = `Showing all ${RECIPES_DB.length} recipes`;
        } else {
            resultsCounter.innerText = `Found ${filtered.length} recipe matches`;
        }
    }

    function searchRecipes(query, list) {
        let terms = query.toLowerCase().split(/[\s,]+/);
        const stopWords = new Set(["please", "find", "a", "recipe", "that", "includes", "and", "or", "in", "with", "show", "me", "meals", "deserts", "desserts", "involve", "involving", "made", "of", "some", "include"]);
        let keywords = terms.filter(t => !stopWords.has(t) && t.length > 1);
        
        if (keywords.length === 0) return list;
        
        // 1. Identify category or method filters from query
        let categoryConstraint = null;
        let methodConstraint = null;
        let searchKeywords = [];
        
        const categoryMap = {
            "entree": "Entree", "entrees": "Entree", "dinner": "Entree", "dinners": "Entree", "meal": "Entree", "meals": "Entree",
            "soup": "Soup", "soups": "Soup", "stew": "Soup", "stews": "Soup",
            "salad": "Salad", "salads": "Salad",
            "breakfast": "Breakfast", "brunch": "Breakfast",
            "dessert": "Dessert", "desserts": "Dessert", "desert": "Dessert", "deserts": "Dessert", "sweet": "Dessert", "sweets": "Dessert",
            "appetizer": "Appetizer", "appetizers": "Appetizer", "starter": "Appetizer", "starters": "Appetizer",
            "bread": "Bread", "breads": "Bread",
            "drink": "Drink", "drinks": "Drink", "beverage": "Drink", "beverages": "Drink",
            "side": "Side", "sides": "Side"
        };
        
        const methodMap = {
            "bake": "Bake", "baking": "Bake", "baked": "Bake",
            "grill": "Grill", "grilling": "Grill", "grilled": "Grill",
            "crockpot": "Crockpot", "crock-pot": "Crockpot", "slowcooker": "Crockpot",
            "sauté": "Sauté", "saute": "Sauté", "sautéing": "Sauté", "sauteing": "Sauté",
            "fry": "Fry", "frying": "Fry", "fried": "Fry",
            "boil": "Boil", "boiling": "Boil", "boiled": "Boil"
        };
        
        for (let kw of keywords) {
            if (categoryMap[kw]) {
                categoryConstraint = categoryMap[kw];
            } else if (methodMap[kw]) {
                methodConstraint = methodMap[kw];
            } else {
                searchKeywords.push(kw);
            }
        }
        
        let scored = [];
        for (let recipe of list) {
            // Apply category and method constraints if present
            if (categoryConstraint && !recipe.tags.includes(categoryConstraint)) {
                continue;
            }
            if (methodConstraint && !recipe.methods.includes(methodConstraint)) {
                continue;
            }
            
            // If no search keywords, it's a pure category/method filter
            if (searchKeywords.length === 0) {
                scored.push({ recipe, score: 100 });
                continue;
            }
            
            let score = 0;
            let matchCount = 0;
            
            let titleText = recipe.title.toLowerCase();
            let descText = recipe.description.toLowerCase();
            let ingredientsLower = recipe.ingredients.map(i => i.toLowerCase());
            let directionsLower = recipe.directions.map(d => d.toLowerCase());
            
            for (let kw of searchKeywords) {
                let kwMatched = false;
                
                // Title match
                if (titleText.includes(kw)) {
                    score += 50;
                    kwMatched = true;
                    if (titleText.startsWith(kw)) score += 10;
                }
                
                // Ingredients check
                for (let ing of ingredientsLower) {
                    if (ing.includes(kw)) {
                        score += 15;
                        kwMatched = true;
                    }
                }
                
                // Directions check
                for (let dir of directionsLower) {
                    if (dir.includes(kw)) {
                        score += 5;
                        kwMatched = true;
                    }
                }
                
                // Description check
                if (descText.includes(kw)) {
                    score += 2;
                    kwMatched = true;
                }
                
                if (kwMatched) {
                    matchCount++;
                }
            }
            
            // If we have keywords, require at least one keyword match
            if (matchCount === 0) {
                continue;
            }
            
            // Give a massive boost to recipes that match ALL search keywords
            if (matchCount === searchKeywords.length) {
                score += 1000;
            } else {
                // If it's a partial match, and there's an explicit "and" in the query, we filter it out!
                if (terms.includes("and")) {
                    continue; // Strict AND filter
                }
                // Otherwise, penalize partial matches so they sink to the bottom
                score -= 200;
            }
            
            scored.push({ recipe, score });
        }
        
        scored.sort((a, b) => b.score - a.score);
        return scored.map(item => item.recipe);
    }

    // 3. Render Grid Cards
    function renderRecipes(recipes) {
        recipesGrid.innerHTML = '';
        
        if (recipes.length === 0) {
            recipesGrid.innerHTML = `
                <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted); font-size: 1.1rem;">
                    No recipes found matching those search criteria.
                </div>
            `;
            return;
        }
        
        recipes.forEach(recipe => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openRecipe(recipe);
            
            // Image
            let imgHTML = '';
            if (recipe.images && recipe.images.length > 0) {
                imgHTML = `<img class="card-img" src="${recipe.images[0]}" alt="${recipe.title}" loading="lazy">`;
            } else {
                imgHTML = `<div class="card-img-placeholder">No Image</div>`;
            }
            
            // Category badges
            let badgesHTML = '';
            recipe.tags.slice(0, 2).forEach(tag => {
                badgesHTML += `<span class="card-tag">${tag}</span>`;
            });
            
            card.innerHTML = `
                <div class="card-img-wrapper">
                    ${imgHTML}
                </div>
                <div class="card-content">
                    <h3 class="card-title">${recipe.title}</h3>
                    <div class="card-tags">
                        ${badgesHTML}
                    </div>
                </div>
            `;
            recipesGrid.appendChild(card);
        });
    }

    // 4. Modal Controller
    const modal = document.getElementById('recipe-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalImg = document.getElementById('modal-img');
    const modalImgContainer = document.getElementById('modal-img-container');
    const modalDesc = document.getElementById('modal-description');
    const modalIngredients = document.getElementById('modal-ingredients');
    const modalDirections = document.getElementById('modal-directions');
    const modalNotes = document.getElementById('modal-notes');
    const modalNotesContainer = document.getElementById('modal-notes-container');

    function openRecipe(recipe) {
        modalTitle.innerText = recipe.title;
        
        // Set Image (defaulting to first, hidden if none)
        if (recipe.images && recipe.images.length > 0) {
            modalImg.src = recipe.images[0];
            modalImgContainer.style.display = 'block';
        } else {
            modalImg.src = '';
            modalImgContainer.style.display = 'none';
        }
        
        // Description
        modalDesc.innerHTML = recipe.description.replace(/\n/g, '<br>');
        modalDesc.style.display = recipe.description ? 'block' : 'none';
        
        // Ingredients with Checkbox items
        modalIngredients.innerHTML = '';
        recipe.ingredients.forEach(ing => {
            const div = document.createElement('div');
            
            // Check if it's a section divider (bold)
            if (ing.startsWith('**') && ing.endsWith('**')) {
                const headerText = ing.replace(/\*\*/g, '');
                div.style.fontWeight = '600';
                div.style.marginTop = '15px';
                div.style.color = 'white';
                div.style.fontSize = '1.05rem';
                div.innerText = headerText;
            } else {
                div.className = 'ingredient-item';
                div.innerHTML = `<input type="checkbox"> <span>${ing}</span>`;
                div.onclick = function() {
                    const cb = this.querySelector('input');
                    cb.checked = !cb.checked;
                    this.classList.toggle('checked', cb.checked);
                };
                div.querySelector('input').onclick = function(e) {
                    e.stopPropagation(); // prevent double toggle
                    this.parentElement.classList.toggle('checked', this.checked);
                };
            }
            modalIngredients.appendChild(div);
        });
        
        // Directions steps
        modalDirections.innerHTML = '';
        let stepIdx = 1;
        recipe.directions.forEach(step => {
            const div = document.createElement('div');
            
            if (step.startsWith('**') && step.endsWith('**')) {
                const subHeader = step.replace(/\*\*/g, '');
                div.style.fontWeight = '600';
                div.style.marginTop = '20px';
                div.style.marginBottom = '10px';
                div.style.color = 'white';
                div.style.fontSize = '1.1rem';
                div.innerText = subHeader;
            } else {
                div.className = 'direction-step';
                div.innerHTML = `
                    <div class="step-number">${stepIdx++}</div>
                    <div class="step-text">${step}</div>
                `;
            }
            modalDirections.appendChild(div);
        });
        
        // Notes / Nutrition
        if (recipe.notes && recipe.notes.length > 0) {
            modalNotes.innerHTML = '';
            recipe.notes.forEach(note => {
                const p = document.createElement('p');
                // Format markdown bold subheaders inside notes
                let formattedNote = note.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                p.innerHTML = formattedNote;
                modalNotes.appendChild(p);
            });
            modalNotesContainer.style.display = 'block';
        } else {
            modalNotesContainer.style.display = 'none';
        }
        
        toggleModal(true);
    }

    function toggleModal(show) {
        if (show) {
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; // Lock background scroll
        } else {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }
    }

    function closeRecipeModal(e) {
        if (e.target === modal) {
            toggleModal(false);
        }
    }

    // Keyboard support: Close modal on Esc
    window.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            toggleModal(false);
        }
    });
</script>
</body>
</html>
